<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput() {
            return (
                <>
                    <input placeholder="Send a message to Chatbot" size="30" />
                    <button>Send</button>
                </>
            );
        }
        function ChatMessage(props) {
            console.log(props);
            const message = props.message;
            return (
                <div>
                    {message}
                    <img src="./images/user.png" width="40"/>
                </div>
            );
        }
        const app = (
            <>
                {/*  {ChatInput()} */}
                <ChatInput />
                <ChatMessage message="hello chatbox" sender="user"/>
                <ChatMessage message="Hello! How can I help You?" sender="robot"/>
                <ChatMessage message="What is current date" sender="user"/>
                <ChatMessage message="Today is 19th September 2016" sender="robot"/>
            </>
        )
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(app);
    </script>
</body>

</html>
