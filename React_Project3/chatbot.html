<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput() {
            return (
                <>
                    <input
                        placeholder="Send a message to chatbot"
                        size="30" />
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { // Destructuring the props directly in the fuction argument
            // console.log(props);
            /* const message = props.message;
            const sender = props.sender; */
            // const {message,sender} = props;

            /* if (sender === "robot") {
                return (
                    <div>
                        <img src="./images/robot.png" width="40" />
                        {message}
                    </div>
                );
            } else {
                return (
                    <div>
                        {message}
                        <img src="./images/user.png" width="40" />
                    </div>
                );
            } */

            return (
                <div>
                    {/* Guard operator- && is used instead of if stmt. if the value1 is true then result will be value2  */}
                    {sender === 'robot' && <img src="./images/robot.png" width="40" />}
                    {message}
                    {sender === 'user' && <img src="./images/user.png" width="40" />}
                </div>
            );
        }

        function App() {
            return (
                <>
                    {/*  {ChatInput()} */}
                    <ChatInput />
                    <ChatMessage
                        message="hello chatbox"
                        sender="user"
                    />
                    <ChatMessage 
                        message="Hello! How can I help You?" sender="robot"
                    />
                    <ChatMessage 
                        message="What is current date" sender="user" 
                    />
                    <ChatMessage 
                        message="Today is 19th September 2016" sender="robot" 
                    />
                </>
            );
        }
        
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
