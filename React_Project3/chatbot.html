<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            function saveInputText(event) {
                setInputText(event.target.value);
            }

            //Lifting the state up - moving the component to outer component lets us to share state bw multiple components
            function sendMessage() {
                console.log(inputText + " msgs:", chatMessages);

                const newChatMessages = [
                    ...chatMessages, //spread operator ... keeps the existing data in the array
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID() //generates random 36 digit unique id in js
                    }
                ];

                //setChatMessages(newChatMessages);

                //In React state doesnot update immediately, state is updated after all of the code is finished
                const response = Chatbot.getResponse(inputText);
                console.log(response);
                setChatMessages([
                    ...newChatMessages, //spread operator ... keeps the existing data in the array
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID() //generates random 36 digit unique id in js
                    }
                ]);
                setInputText('');
            }

            return (
                <>
                    <input
                        placeholder="Send a message to chatbot"
                        size="30" onChange={saveInputText} value={inputText} />
                    <button onClick={sendMessage}>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { // Destructuring the props directly in the fuction argument
            // console.log(props);
            /* const message = props.message;
            const sender = props.sender; */
            // const {message,sender} = props;

            /* if (sender === "robot") {
                return (
                    <div>
                        <img src="./images/robot.png" width="40" />
                        {message}
                    </div>
                );
            } else {
                return (
                    <div>
                        {message}
                        <img src="./images/user.png" width="40" />
                    </div>
                );
            } */

            return (
                <div>
                    {/* Guard operator- && is used instead of if stmt. if the value1 is true then result will be value2  */}
                    {sender === 'robot' && <img src="./images/robot.png" width="40" />}
                    {message}
                    {sender === 'user' && <img src="./images/user.png" width="40" />}
                </div>
            );
        }

        function ChatMessages({ chatMessages }) {
            //The map() method loops through an array, applies a function to every item, and returns a brand-new array with the transformed values. It does not modify your original array
            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </>
            );
        }

        function App() {

            const [chatMessages, setChatMessages] = React.useState([{
                message: 'hello chatbox',
                sender: 'user',
                id: "id1"
            }, {
                message: 'Hello! How can I help You?',
                sender: 'robot',
                id: "id2"
            }, {
                message: 'What is current date',
                sender: 'user',
                id: "id3"
            }, {
                message: 'Today is 19th September 2016',
                sender: 'robot',
                id: "id4"
            },]);

            /*const [chatMessages,setChatMessages] = chatMessagesArray;

            const chatMessages = chatMessagesArray[0];
            const setChatMessages = chatMessagesArray[1]; */

            return (
                <>
                    {/*  {ChatInput()} */}
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
