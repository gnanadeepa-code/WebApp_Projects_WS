<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 0.5rem;
            margin: 0.6rem;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
        }

        .chat-input {
            padding: 0.5rem;
            border-radius: 10px;
            border-width: 1px;
            font-size: 1em;
            flex-grow: 1;
        }

        .chat-input-container {
            display: flex;
            margin-bottom: 60px;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }

        .chat-message-profile {
            width: 45px;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            function saveInputText(event) {
                setInputText(event.target.value);
            }

            //Lifting the state up - moving the component to outer component lets us to share state bw multiple components
            function sendMessage() {
                console.log(inputText + " msgs:", chatMessages);

                const newChatMessages = [
                    ...chatMessages, //spread operator ... keeps the existing data in the array
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID() //generates random 36 digit unique id in js
                    }
                ];

                //setChatMessages(newChatMessages);

                //In React state doesnot update immediately, state is updated after all of the code is finished
                const response = Chatbot.getResponse(inputText);
                console.log(response);
                setChatMessages([
                    ...newChatMessages, //spread operator ... keeps the existing data in the array
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID() //generates random 36 digit unique id in js
                    }
                ]);
                setInputText('');
            }

            return (
                <div className="chat-input-container">
                    <input className="chat-input"
                        placeholder="Send a message to chatbot"
                        size="30" onChange={saveInputText} value={inputText} />
                    <button className="send-button" onClick={sendMessage}>Send</button>
                </div>
            );
        }

        function ChatMessage({ message, sender }) { // Destructuring the props directly in the fuction argument
            // console.log(props);
            /* const message = props.message;
            const sender = props.sender; */
            // const {message,sender} = props;

            /* if (sender === "robot") {
                return (
                    <div>
                        <img src="./images/robot.png" width="40" />
                        {message}
                    </div>
                );
            } else {
                return (
                    <div>
                        {message}
                        <img src="./images/user.png" width="40" />
                    </div>
                );
            } */

            return (
                <div className={
                    sender === 'user'
                        ? 'chat-message-user'
                        : 'chat-message-robot'
                }>
                    {/* Guard operator- && is used instead of if stmt. if the value1 is true then result will be value2  */}
                    {sender === 'robot' && <img src="./images/robot.png" className="chat-message-profile" />}
                    <div class="chat-message-text">
                        {message}
                    </div>
                    {sender === 'user' && <img src="./images/user.png" className="chat-message-profile" />}
                </div>
            );
        }

        function ChatMessages({ chatMessages }) {

            //In React we shd not use the DOM manually, instead we shd use React features called useRef() hook to get the html elt we want to manipulate. useRef() lets us automatically save an HTML elt from the component.Now the html elt div which is ref to this chatMessagesRef will be saved inside this ref 
            const chatMessagesRef = React.useRef(null); //null is initial value

            //To add auto scrolling feature in chatbox when a new msg is typed, useEffect hook needs to be used. useEffect lets us to run some code after the component is created or updated.
            React.useEffect(() => {
                const containerElem = chatMessagesRef.current;
                if(containerElem){
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            }, [chatMessages]); //The 2nd parameter array called dependency arrays controls when the useEffect will run. [] empty array means only run once after the component is created. since chatMessages is given inside array react will run this function every time chatMessages changes.

            //The map() method loops through an array, applies a function to every item, and returns a brand-new array with the transformed values. It does not modify your original array
            return (
                <div className="chat-messages-container" ref={chatMessagesRef}> 
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </div>
            );
        }

        function App() {

            const [chatMessages, setChatMessages] = React.useState([{
                message: 'hello chatbox',
                sender: 'user',
                id: "id1"
            }, {
                message: 'Hello! How can I help You?',
                sender: 'robot',
                id: "id2"
            }, {
                message: 'What is current date',
                sender: 'user',
                id: "id3"
            }, {
                message: 'Today is 19th September 2016',
                sender: 'robot',
                id: "id4"
            },]);

            /*const [chatMessages,setChatMessages] = chatMessagesArray;

            const chatMessages = chatMessagesArray[0];
            const setChatMessages = chatMessagesArray[1]; */

            return (
                <div className="app-container">
                    {/*  {ChatInput()} */}

                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
