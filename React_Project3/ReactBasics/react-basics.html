<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const itemCost = 10;
        const quantity = 4;
        const paragraph = <p>Product cost: {itemCost}</p>;
        const today = new Date();
        const div = <div>
            <button>Good job!</button>
            <p>My name is Deepa</p>
            <p>Cotton Socks</p>
            <p>Price Rs. {itemCost}</p>
            <p>Quantity: {quantity}</p>
            <p>Total Price: {itemCost * quantity}</p>
            {paragraph}

            <p>Today: {today.toLocaleString()} , year : {today.getFullYear()}, month :{today.getMonth() + 1}, day:{today.getDay()}, date:{today.getDate()}</p>
            <button>Add to Cart</button>
        </div>;

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(div);

        //Below code updates the time for everysecond and re-renders the browser for every second with updated time
        setInterval(() => {
            const today = new Date();
            const div = <div>

                <p>Time change using setInterval</p>
                <p>Today: {today.toLocaleString()} , year : {today.getFullYear()}, month :{today.getMonth() + 1}, day:{today.getDay()}, date:{today.getDate()}</p>
                <button>Date Change</button>
            </div>;
            console.log(today.toLocaleString());
            root.render(div);
        }, 1000);  
    </script>
</body>

</html>
