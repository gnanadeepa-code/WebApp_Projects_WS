<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards Project</title>
    <link rel="stylesheet" href="css/cardsStyle.css" />
</head>
<body>
    <header>
        <h1>Profile Cards</h1>
        <nav>
            <a href="#profile1">Earn</a>
            <a href="#profile2">Grow</a>
            <a href="#profile3">Give</a>
        </nav>
    </header>
    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="images/quotes.jpg" alt="Quotes" width="500" height="500"/>
                <figcaption>Quotes 1</figcaption>
            </figure>
            <p><q>Let's Earn Money</q></p>
        </article>
        <article id="profile2" class="card">
            <figure>
                <img src="images/quotes1.jpg" alt="Quotes" width="500" height="500"/>
                <figcaption>Quotes 2</figcaption>
            </figure>
            <p><q>Let's Grow Money</q></p>
        </article>
        <article id="profile3" class="card">
            <figure>
                <img src="images/quotes2.jpg" alt="Quotes" width="500" height="500"/>
                <figcaption>Quotes 3</figcaption>
            </figure>
            <p><q>Let's <span class="nowrap">Give Money</span></q></p>
        </article>
    </main>
    <footer>
        <p>&copy; DS Limited. 2026.</p>
    </footer>
</body>
</html>
