<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer type="module" src="js/main.js"></script>
    <!--Here "defer" is important to load the js after the html elts are created. Else we will get null in js while trying to access the html elts dynamically-->
    <!--type="module" is needed when we are using more than 1 js files as a module.When type is mentioned as module no need to mention "defer" explicitly and also "use strict" also will be activated by default to find the errors easily. when the application is launced using live server only the module will work.-->
</head>

<body>
    <nav>
        <h1>
            JS Document
        </h1>
    </nav>
    <main>
        <section id="view1" class="view view1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </section>
        <section id="view2" class="view view2">
            <h2>My 2nd view</h2>
        </section>
        <section id="view3" class="view">
            <div>
                <h2>My 3rd view</h2>
            </div>
        </section>
        <section id="view4" class="view4">
            <form id="myForm" action="">
                <label for="myTextInput">Text Input : </label>
                <input type="text" id="myTextInput" autocomplete="off"/>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
</body>

</html>
