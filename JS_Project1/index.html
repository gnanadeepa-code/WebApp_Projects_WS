<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
    <!--Here "defer" is important to load the js after the html elts are created. Else we will get null in js while trying to access the html elts dynamically-->
</head>

<body>
    <nav>
        <h1>
            JS Document
        </h1>
    </nav>
    <main>
        <section id="view1" class="view view1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </section>
        <section id="view2" class="view view2">
            <h2>My 2nd view</h2>
        </section>
        <section id="view3" class="view">
            <div>
                <h2>My 3rd view</h2>
            </div>
        </section>
    </main>
</body>

</html>
